# =============================================================
# hAI.9Router - Portainer Stack Template
# Official Docker Image: decolua/9router
# Port: 20128 | Data Dir: ./data
# =============================================================

version: "3.9"

services:
  9router:
    image: decolua/9router:latest
    container_name: hai_9router
    restart: unless-stopped
    
    ports:
      - "${ROUTER_PORT:-20128}:20128"
    
    volumes:
      - ./data:/app/data
    
    environment:
      # Core 9Router Settings
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      
      # Authentication (optional)
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-secret}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-123456}
      
      # Timezone
      - TZ=${TZ:-Europe/Berlin}
    
    networks:
      - 9router_net
    
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:20128"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    labels:
      - "com.docker.compose.project=hai-9router"
      - "org.opencontainers.image.title=hAI.9Router"
      - "org.opencontainers.image.description=AI Routing Proxy with LAN Dashboard"
      - "org.opencontainers.image.version=1.0.0"

networks:
  9router_net:
    name: 9router_net
    driver: bridge

# =============================================================
# USAGE:
#   Portainer: Stacks > Add Stack > Repository
#              URL: https://github.com/jbkunama1/hAI.9Router
#   Dashboard: http://<HOST-IP>:20128
#   Login:     Password from INITIAL_PASSWORD (default: 123456)
# =============================================================
